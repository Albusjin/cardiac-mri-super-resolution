# 教学参考：仅替换本机路径；不可直接启动。<RUN_DIR> 需按本地环境配置。
name: current_IXI_full_stage2
model_type: GaussM2ASRModel
scale: 4
num_gpu: 1
manual_seed: 0
tile_size: 48
tile_overlap: 8
tile_process: false
crop_size: 4
denominator: 8
default_step_size: 1.2
cuda_rendering: true
mode: scale_modify
if_dmax: true
dmax_mode: fix
dmax: 0.5
datasets:
  train:
    name: current_IXI_train
    type: ContinuousBicubicDownsampleDataset
    all_gt_list:
    - <RUN_DIR>/data/train/HR
    filename_tmpl: '{}'
    io_backend:
      type: disk
    lr_size: 64
    gt_size: 256
    use_hflip: false
    use_rot: false
    sample_size: 0
    scale_list:
    - 1.0
    - 4.0
    num_worker_per_gpu: 4
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: null
    round_mode: round
  val:
    name: current_IXI_val
    type: ContinuousBicubicDownsampleDataset
    all_gt_list:
    - <RUN_DIR>/data/val/HR
    filename_tmpl: '{}'
    io_backend:
      type: disk
    lr_size: 64
    gt_size: 256
    use_hflip: false
    use_rot: false
    sample_size: 0
    scale_list:
    - 4.0
    - 4.0
network_g:
  type: GaussM2ASRNet
  num_in_ch: 1
  num_feat: 64
  num_block: 16
  res_scale: 1.0
  channel: 180
  num_heads: 6
  num_crossattn_blocks: 1
  num_crossattn_layers: 3
  num_selfattn_blocks: 5
  num_selfattn_layers: 5
  num_gs_seed: 64
  gs_up_factor: 1.0
  window_size: 8
  img_range: 1.0
  shuffle_scale1: 2
  shuffle_scale2: 2
network_fea2gs:
  type: AnatomyGuidedGaussianParametrizer
  channel: 180
  num_gs_seed: 64
  num_colors: 3
  gs_up_factor: 1.0
  window_size: 8
path:
  pretrain_network_g: null
  strict_load_g: true
  resume_state: null
  param_key_g: params
  experiments_root: <RUN_DIR>/experiments
path_fea2gs:
  pretrain_network_fea2gs: <RUN_DIR>/experiments/current_IXI_full_stage1/models/net_fea2gs_40000.pth
  strict_load_fea2gs: true
  resume_state: null
  param_key_fea2gs: params
train:
  stage: stage2
  clip_grad_norm: false
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: 0.0002
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  optim_fea2gs:
    type: Adam
    lr: 0.0002
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  scheduler:
    type: MultiStepLR
    milestones:
    - 250000
    - 400000
    - 450000
    - 475000
    gamma: 0.5
  total_iter: 500000
  warmup_iter: 2000
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
val:
  val_freq: 2000.0
  save_img: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
logger:
  print_freq: 500
  save_checkpoint_freq: 2000.0
  use_tb_logger: true
  wandb:
    project: null
    resume_id: null
dist_params:
  backend: nccl
  port: 29500
